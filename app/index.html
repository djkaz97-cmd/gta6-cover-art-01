<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover</title>
<link rel="stylesheet" href="./style.css">
<style>
@font-face { font-family: 'Anton'; src: url('./fonts/Anton-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; }
</style>
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Vice Cover</h1>
    <p>Turn your photos into GTA-style cover art.</p>
    <label>Photos <input id="photos" type="file" accept="image/*" multiple></label>
    <label>Panels <select id="panels"><option value="3">3 panels</option><option value="2">2 panels</option><option value="4">4 panels</option></select></label>
    <label>Active panel <select id="active"></select></label>
    <label>Size <select id="size"><option value="1080x1080">1080 x 1080</option><option value="1080x1350">1080 x 1350</option><option value="1920x1080">1920 x 1080</option></select></label>
    <label>Caption <input id="caption" type="text" maxlength="48" value="VICE NIGHTS"></label>
    <div class="row">
      <button id="export" type="button">Export PNG</button>
    </div>
    <p id="status" role="status"></p>
    <p class="hint">Drag on a panel to reposition its photo. Click a panel to make it active.</p>
  </section>
  <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
